name: Desktop release

# Push a tag like desktop-v0.1.0 (matching VERSION in desktop/CMakeLists.txt) to
# build every platform and publish a GitHub Release. "Run workflow" on the
# Actions tab builds the same files as downloadable artifacts without releasing.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    # Oldest supported runner: the AppImage runs on distros with this glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgit2-dev pkg-config libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfuse2
      # Ubuntu's own Qt is too old (the QML uses Qt 6.5+ APIs)
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Build AppImage
        run: desktop/packaging/build-appimage.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: loopin-linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-libgit2
            mingw-w64-x86_64-qtkeychain-qt6
            mingw-w64-x86_64-nsis
      - name: Build installer
        run: desktop/packaging/build-windows.sh "$(cygpath -u "$GITHUB_WORKSPACE")/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: loopin-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install qt libgit2 ninja
      - name: Build dmg
        run: desktop/packaging/build-macos.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: loopin-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the app version
        run: |
          app_version="$(sed -n 's/^project(loopin_desktop VERSION \([0-9.]*\).*/\1/p' desktop/CMakeLists.txt)"
          if [ "desktop-v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $app_version in desktop/CMakeLists.txt"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Loopin Desktop ${{ github.ref_name }}
          files: dist/*
          body_path: desktop/packaging/RELEASE_NOTES.md
