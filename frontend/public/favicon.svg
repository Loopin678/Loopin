<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Loopin</title>
  <!-- Dark tile so the mark reads on light and dark browser tabs -->
  <rect width="512" height="512" rx="116" fill="#0B0C0A"/>
  <g transform="translate(256 256)">
    <!-- Open loop: starts just left of 12 o'clock, runs round the left, bottom and right, ends near 1 o'clock -->
    <path d="M -36 -184 A 188 188 0 1 0 128 -138" fill="none" stroke="#D0E36A" stroke-width="26" stroke-linecap="round"/>
    <circle cx="128" cy="-138" r="21" fill="#D0E36A"/>
    <!-- Four teammates around the table: heads -->
    <g fill="#F4F5EF">
      <circle cx="0" cy="-130" r="27"/>
      <circle cx="0" cy="130" r="27"/>
      <circle cx="-130" cy="0" r="27"/>
      <circle cx="130" cy="0" r="27"/>
      <!-- bodies, rounded on the outside and meeting at a square table -->
      <path d="M -44 -38 V -50 A 44 44 0 0 1 44 -50 V -38 Z"/>
      <path d="M -44 38 V 50 A 44 44 0 0 0 44 50 V 38 Z"/>
      <path d="M -38 -44 H -50 A 44 44 0 0 0 -50 44 H -38 Z"/>
      <path d="M 38 -44 H 50 A 44 44 0 0 1 50 44 H 38 Z"/>
    </g>
  </g>
</svg>
