<text x="895" y="1033" font-family="Arial" font-size="17" fill="#111">delete [requester is ACTIVE project member]</text>
<path d="M1605 920 V1240" stroke="#111" stroke-width="2.5"/><path d="M1596 1226 L1605 1241 L1614 1226" stroke="#111" stroke-width="2.5" fill="none"/>
<circle cx="1605" cy="1280" r="22" fill="white" stroke="#111" stroke-width="3"/><circle cx="1605" cy="1280" r="13" fill="#111"/>
<g font-family="Arial" font-size="15" fill="#24364b">
<text x="205" y="1090">Guards enforced by backend:</text>
<text x="205" y="1120">1. requester must be an ACTIVE project member</text>
<text x="205" y="1150">2. assignee must be an ACTIVE member of the same project</text>
<text x="205" y="1180">3. destination list.projectId must equal task.projectId</text>
<text x="205" y="1210">4. movement reindexes destination and source positions transactionally</text>
<text x="205" y="1360" font-size="13" fill="#555">Based on backend/prisma/schema.prisma, taskService.ts, taskRepository.ts, taskController.ts, Board.tsx, TaskModal.tsx, boardStore.ts, and harness task command.</text>
</g>
