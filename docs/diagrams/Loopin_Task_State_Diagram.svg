<g font-family="Arial" font-size="16" fill="#222">
<text x="240" y="825" font-weight="700">Self-transitions from every list state:</text>
<text x="260" y="858">• Edit title / description / stack / priority / due date</text>
<text x="260" y="890">• Assign or unassign [assignee must be ACTIVE member]</text>
<text x="260" y="922">• Reorder / update position</text>
<text x="260" y="954">• Associate commit [optional commitId]</text>
<text x="260" y="986">• Reject move [destination belongs to a different project] — retain current state</text>
</g>
